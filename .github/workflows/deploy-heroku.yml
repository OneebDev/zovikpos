name: CI/CD Pipeline - Deploy Backend & AI Service to Heroku

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend to Heroku
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy Backend to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote add heroku-backend https://heroku:${HEROKU_API_KEY}@git.heroku.com/zovik-pos-backend.git
          git subtree push --prefix=backend heroku-backend main

  deploy-ai-service:
    name: Deploy AI Service to Heroku
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh

      - name: Deploy AI Service to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote add heroku-ai https://heroku:${HEROKU_API_KEY}@git.heroku.com/zovik-pos-ai.git
          git subtree push --prefix=ai-service heroku-ai main
