name: CI/CD Pipeline - Deploy Backend & AI Service to Heroku

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend to Heroku
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy Backend to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "zovik-pos-backend"
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: "backend"

  deploy-ai-service:
    name: Deploy AI Service to Heroku
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy AI Service to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: "zovik-pos-ai"
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          appdir: "ai-service"
